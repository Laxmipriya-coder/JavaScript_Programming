<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: #198754;
            color: white;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar h2 {
            font-size: 28px;
        }

        /* Search Box */
        .find {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .find input {
            padding: 10px;
            width: 220px;
            border-radius: 6px;
            outline: none;
            border: none;
            font-size: 15px;
        }

        .find i {
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .icon {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .note {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .note i {
            font-size: 25px;
            padding: 10px;
            background-color: #dc3545;
            border-radius: 5px;
        }

        .val {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: red;
            color: white;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .user-icon {
            font-size: 35px;
            cursor: pointer;
            padding: 5px;
            background-color: blue;
            border-radius: 5px;
        }

        .find i:hover {
            color: gray;
        }

        .note i:hover {
            background-color: #bb2d3b;
        }

        .user-icon:hover {
            background-color: #0b5ed7;
        }

        .box {
            height: 500px;
            max-width: 500px;
            margin: 100px auto;
            background-color: grey;
            border-radius: 10px;
        }

        .usn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .user-icon {
            font-size: 35px;
            padding: 5px;
            background-color: blue;
            color: white;
            border-radius: 5px;
        }

        .usn .val {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: lightgreen;
            color: black;
            font-size: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .usn:hover .user-icon {
            background-color: #0b5ed7;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h2>Navbar</h2>
        <div class="find">
            <input type="text" placeholder="Search something...">
            <i class="fa-solid fa-magnifying-glass" title="Search"></i>
        </div>
        <div class="icon">
            <div class="note" title="Notifications">
                <i class="fa-solid fa-bell"></i>
                <span class="val">3</span>
            </div>

            <div class="usn">
                <i class="fa-solid fa-circle-user user-icon"></i>
                <span class="val">
                    <i class="fa-solid fa-check"></i>
                </span>
            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="box"></div>

</body>

</html>
